# dsh-plugin-store bundle patch: inserts the plugin row into the web profile roster.
# Applied as a profile bundle layer (the `dsh.bundle.patch` manifest field).
# Activate with `dsh plugin --profile <name> add link:~/workplace/dsh-plugins/packages/dsh-plugin-store`.
- insert:
    - id: app-store
      name: 'dsh-plugin-store'
